<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Saved baggg</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="auth-required">
    <section class="auth-screen" id="authScreen" aria-label="登录注册">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M6.5 8.5h11l-.8 10.2a2 2 0 0 1-2 1.8H9.3a2 2 0 0 1-2-1.8L6.5 8.5Z" />
              <path d="M9 8.5V7a3 3 0 0 1 6 0v1.5" />
              <path d="M10 13h4" />
            </svg>
          </div>
          <div>
            <h1>Saved baggg</h1>
            <p>登录后进入你的收藏空间</p>
          </div>
        </div>

        <form class="auth-form" id="authForm">
          <div class="auth-mode" role="tablist" aria-label="账号模式">
            <button class="active" id="loginModeButton" type="button">登录</button>
            <button id="registerModeButton" type="button">注册</button>
          </div>

          <label>
            账号
            <input id="authUsername" type="text" autocomplete="username" maxlength="40" placeholder="输入账号" required />
          </label>

          <label>
            密码
            <input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="至少 6 位" required />
          </label>

          <p class="auth-message" id="authMessage" role="status"></p>

          <button class="primary-button auth-submit" id="authSubmitButton" type="submit">
            <span>登录</span>
          </button>
        </form>
      </div>
    </section>

    <button class="mobile-nav-toggle" id="mobileNavToggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="打开菜单">
      <span class="ui-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 7h16" /><path d="M4 12h16" /><path d="M4 17h16" /></svg>
      </span>
    </button>
    <button class="drawer-scrim" id="drawerScrim" type="button" aria-label="关闭菜单"></button>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M6.5 8.5h11l-.8 10.2a2 2 0 0 1-2 1.8H9.3a2 2 0 0 1-2-1.8L6.5 8.5Z" />
              <path d="M9 8.5V7a3 3 0 0 1 6 0v1.5" />
              <path d="M10 13h4" />
            </svg>
          </div>
          <div>
            <h1>Saved baggg</h1>
          </div>
        </div>

        <nav class="view-nav" aria-label="页面">
          <button class="view-button active" id="homeViewButton" type="button">
            <span class="ui-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8" /><path d="M5 10v10h14V10" /><path d="M10 20v-6h4v6" /></svg>
            </span>
            <span>Home</span>
          </button>
        </nav>

        <div class="category-section">
          <div class="category-section-head">
            <div class="side-label">收藏板块</div>
            <button class="category-manage-done" id="categoryManageDone" type="button" hidden>完成</button>
          </div>
          <nav class="category-nav" id="categoryNav" aria-label="收藏板块"></nav>
          <form class="category-add-form" id="categoryAddForm">
            <input id="categoryNameInput" type="text" autocomplete="off" maxlength="12" placeholder="新增分类" />
            <button class="category-add-button" type="submit" aria-label="新增分类">
              <span class="ui-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 5v14" /><path d="M5 12h14" /></svg>
              </span>
              <span>新增分类</span>
            </button>
          </form>
        </div>

        <div class="account-panel">
          <span>当前账号</span>
          <strong id="accountName"></strong>
          <button class="account-logout" id="logoutButton" type="button">退出登录</button>
        </div>
      </aside>

      <main class="workspace">
        <div class="view-panel active" id="homeView">
          <section class="capture-panel" aria-label="新收藏">
            <div class="capture-head">
              <div>
                <h2>新收藏</h2>
                <p id="analysisMode">链接正文解析 + 本地归类</p>
              </div>
              <button class="secondary-button" id="pasteButton" type="button">
                <span class="ui-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M9 5h6" /><path d="M9 3h6v4H9z" /><path d="M7 5H5v16h14V5h-2" /></svg>
                </span>
                <span>读取剪贴板</span>
              </button>
            </div>

            <form id="captureForm" class="capture-form">
              <textarea
                id="sourceInput"
                name="sourceInput"
                rows="5"
                autocomplete="off"
                placeholder="粘贴一个链接；如果平台限制读取，也可以在链接后补充原文或截图识别文字"
              ></textarea>

              <div class="form-grid">
                <label>
                  板块
                  <select id="categoryInput" name="categoryInput">
                    <option value="">自动</option>
                  </select>
                </label>

                <label>
                  状态
                  <select id="statusInput" name="statusInput">
                    <option value="未看">未看</option>
                    <option value="浏览中">浏览中</option>
                    <option value="已看">已看</option>
                    <option value="已完成">已完成</option>
                  </select>
                </label>

              </div>

              <div class="capture-actions">
                <button class="primary-button" id="submitButton" type="submit">
                  <span class="ui-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M4 12h16" /><path d="m14 6 6 6-6 6" /><path d="M4 6h5" /><path d="M4 18h5" /></svg>
                  </span>
                  <span>整理收藏</span>
                </button>
              </div>
            </form>
          </section>

        </div>

        <div class="view-panel" id="collectionsView">
          <section class="control-panel" id="searchPanel" aria-label="检索">
            <div class="search-row">
              <label class="search-box">
                检索
                <input id="searchInput" type="search" autocomplete="off" placeholder="标题、标签、来源" />
              </label>
              <label>
                板块
                <select id="categoryFilter"></select>
              </label>
              <label>
                状态
                <select id="statusFilter">
                  <option value="全部">全部</option>
                  <option value="未看">未看</option>
                  <option value="浏览中">浏览中</option>
                  <option value="已看">已看</option>
                  <option value="已完成">已完成</option>
                </select>
              </label>
            </div>

            <div class="search-results" id="searchResults"></div>
          </section>

          <section class="collection-board" aria-label="收藏列表">
            <div class="board-head">
              <div class="board-title">
                <h2 id="boardTitle">全部收藏</h2>
                <span id="boardCount"></span>
              </div>
              <div class="board-tools" aria-label="收藏查看方式">
                <div class="view-mode-toggle" role="group" aria-label="查看方式">
                  <button class="active" id="listModeButton" type="button">
                    <span class="ui-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24"><path d="M8 6h13" /><path d="M8 12h13" /><path d="M8 18h13" /><path d="M3 6h.01" /><path d="M3 12h.01" /><path d="M3 18h.01" /></svg>
                    </span>
                    <span>列表</span>
                  </button>
                  <button id="browseModeButton" type="button">
                    <span class="ui-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" /><path d="M9 9h6" /><path d="M9 13h6" /></svg>
                    </span>
                    <span>浏览</span>
                  </button>
                </div>
              </div>
            </div>
            <div class="browse-view" id="browseView" hidden>
              <div class="browse-shell">
                <button class="browse-nav" id="browsePrevButton" type="button" aria-label="上一条收藏">
                  <span class="ui-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
                  </span>
                </button>
                <div class="browse-card" id="browseCard"></div>
                <button class="browse-nav" id="browseNextButton" type="button" aria-label="下一条收藏">
                  <span class="ui-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
                  </span>
                </button>
              </div>
              <div class="browse-footer">
                <span id="browseCounter"></span>
              </div>
            </div>
            <div class="item-list" id="itemList"></div>
          </section>
        </div>
      </main>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
